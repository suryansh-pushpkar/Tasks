<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
</head>
<body>

<div class="class" th:object="${user}">
    <p>Username: <strong th:text="*{username}"></strong></p>
    <p>Email: <strong th:text="*{email}"></strong></p>
    <p>Password: <strong th:text="*{password}"></strong></p>
    <p>Role: <strong th:text="*{role}"></strong></p>

</div>

</body>
</html>
