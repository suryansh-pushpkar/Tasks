spring.application.name=FriendBook
server.port=8080

# MySQL persistence
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/friendbookdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
spring.jpa.open-in-view=false

# Redis for rate limiting
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT configuration
app.security.jwt.secret=${JWT_SECRET:FriendBookSecretKeyFriendBookSecretKey123456}
app.security.jwt.expiration-hours=6
app.security.jwt.cookie-name=FRIENDBOOK_TOKEN

# Google reCAPTCHA v3
app.security.captcha.enabled=${CAPTCHA_ENABLED:false}
app.security.captcha.secret=${CAPTCHA_SECRET:}
app.security.captcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Redis rate limiting windows
app.security.rate-limit.signup.max-attempts=5
app.security.rate-limit.signup.window-minutes=10
app.security.rate-limit.login.max-attempts=10
app.security.rate-limit.login.window-minutes=10
