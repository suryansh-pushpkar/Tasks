<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register | FriendBook</title>
    <div th:replace="~{fragments/styles :: common-head}"></div>

    <script th:src="|https://www.google.com/recaptcha/api.js?render=6LcQgJsrAAAAAIh7ctqhSrxCrksu6TL2lvFWp15O|"></script>

    <style>
        .signup-card {
            max-width: 400px;
            margin: 80px auto;
            border: 1px solid #dbdbdb;
            background-color: #fff;
            padding: 40px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="container">
    <div class="signup-card shadow-sm rounded">
        <h2 class="brand-logo text-center mb-4">FriendBook</h2>
        <p class="text-muted text-center mb-4">Sign up to see photos from your friends.</p>

        <form id="signupForm"  >
            <div class="mb-3">
                <input type="text" id="fullName" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="Password"
                       required minlength="8" title="Minimum 8 characters">
            </div>

            <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response">

            <button type="submit" class="btn btn-primary w-100 fw-bold">Sign Up</button>
        </form>

        <div id="message" class="mt-3 small text-center"></div>

        <hr>
        <p class="text-center mb-0">
            Have an account? <a th:href="@{/login}" class="text-decoration-none fw-bold">Log in</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script th:src="|https://www.google.com/recaptcha/api.js?render=6LfxnY0sAAAAAAHD5n738xWvgiNERN--S1dFgdaR|"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function () {
        const signupForm = $('#signupForm');
        const messageDiv = $('#message');
        const siteKey = '6LfxnY0sAAAAAAHD5n738xWvgiNERN--S1dFgdaR'; // Must match script tag above

        signupForm.on('submit', function (e) {
            e.preventDefault();
            console.log("Submit intercepted...");

            grecaptcha.ready(function () {
                grecaptcha.execute(siteKey, { action: 'signup' }).then(function (token) {
                    console.log("Token generated: ", token);

                    const formData = {
                        fullName: $('#fullName').val(),
                        email: $('#email').val(),
                        password: $('#password').val(),
                        captchaToken: token
                    };

                    $.ajax({
                        url: '/auth/signup', 
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(formData),
                        beforeSend: function() {
                            signupForm.find('button').prop('disabled', true).text('Processing...');
                        },
                        success: function (response) {
                            messageDiv.html(`<div class="alert alert-success">${response.message}</div>`);
                            setTimeout(() => { window.location.href = '/login'; }, 1500);
                        },
                        error: function (xhr) {
                            signupForm.find('button').prop('disabled', false).text('Sign Up');
                            let errorMsg = xhr.responseJSON ? xhr.responseJSON.message : "Signup failed.";
                            messageDiv.html(`<div class="alert alert-danger">${errorMsg}</div>`);
                        }
                    });
                }).catch(err => console.error("reCaptcha Error:", err));
            });
        });
    });
</script>
</body>
</html>
